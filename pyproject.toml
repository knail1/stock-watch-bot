[project]
name = "stockwatch"
version = "0.1.0"
description = "Local bot that watches retailers for in-stock items and alerts your phone"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "playwright>=1.45",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "selectolax>=1.0",  # use selectolax.lexbor (the Modest backend was removed in 1.0)
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
stockwatch = "stockwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
