{% extends "base.html" %}
{% block title %}Sign in · StockWatch{% endblock %}
{% block content %}
<form method="post" action="/login" class="card narrow">
  <h1>Enter PIN</h1>
  {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label>PIN
    <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" autofocus required>
  </label>
  <button type="submit" class="primary">Sign in</button>
</form>
{% endblock %}
